# Each profile is one "car I'd consider". Edit these to match what you're actually looking for.
#
# models:     "make:model" Sauto SEO names (see the URL on sauto.cz, e.g. /inzerce/osobni/skoda/octavia)
# fuel:       benzin, nafta, hybridni, elektro, lpg-benzin, cng-benzin, ...
# gearbox:    manualni, automaticka
# body:       kombi, hatchback, liftback, sedanlimuzina, suv, mpv, ...
# Price filters are in CZK; year is the manufacturing year.

profiles:
  - name: octavia-iii-combi
    models: ["skoda:octavia"]
    price_max: 300000
    mileage_max: 180000
    year_min: 2015
    year_max: 2020
    fuel: [benzin, nafta]
    body: [kombi]
    exclude_keywords: ["havarovan", "na díly", "poškozen", "bez stk"]

  - name: golf-vii
    models: ["volkswagen:golf"]
    price_max: 250000
    mileage_max: 180000
    year_min: 2013
    year_max: 2020
    fuel: [benzin]
    exclude_keywords: ["havarovan", "na díly", "poškozen", "bez stk"]
