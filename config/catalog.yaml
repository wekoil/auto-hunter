# Vehicle knowledge base: generations and engines, used to classify listings locally
# (Sauto has no generation filter) and to attach reliability notes.
#
# Engine status:  preferred | ok | caution | unvetted | avoid
#   avoid: listings identified as this engine are rejected; if it's only one of the
#   possibilities, the listing is kept with a warning to confirm the engine code.
# Notes are starting points for the research phase, not verified conclusions.
# Edit freely, then run `auto-hunter reassess` to re-label stored listings.
#
# Generations: years are inclusive manufacturing years of the ESTATE version; adjacent
# generations overlap in changeover years on purpose. title_hints are regexes matched
# against the lowercased, diacritics-free title. vin_codes are VW-group type codes (VIN
# characters 7-8) and decide changeover years when a VIN is known; leave them out where
# generations share a code (Golf V/VI are both 1K). A listing's generation is resolved
# from year, VIN, title hints and which engines that generation actually had.

generations:
  # Only the Tour years (sold alongside the Octavia II); older cars are out of scope.
  octavia-1:
    label: Škoda Octavia I Tour (1U)
    models: [skoda:octavia]
    years: [2004, 2010]
    title_hints: ['\btour\b', 'octavia,?\s*(i|1)\b(?![.,]\d)', '\b1u\b']
    vin_codes: [1U]
    engines: [ea113-1.6-mpi]

  octavia-2:
    label: Škoda Octavia II (1Z)
    models: [skoda:octavia]
    years: [2004, 2013]
    title_hints: ['octavia,?\s*(ii|2)\b(?![.,]\d)', '\b1z\b']
    vin_codes: [1Z]
    engines: [ea113-1.6-mpi, vw-1.6-fsi, ea111-1.2-tsi, ea111-1.4-tsi, ea888-1.8-tsi-early,
              vw-2.0-fsi]

  octavia-3:
    label: Škoda Octavia III (5E)
    models: [skoda:octavia]
    years: [2013, 2020]
    title_hints: ['octavia,?\s*(iii|3)\b(?![.,]\d)', '\b5e\b']
    vin_codes: [NE]
    engines: [ea211-1.0-tsi, ea211-1.2-tsi, ea211-1.4-tsi, ea211-1.5-tsi, ea211-1.6-mpi,
              ea888-1.8-tsi, ea888-2.0-tsi]

  octavia-4:
    label: Škoda Octavia IV (NX)
    models: [skoda:octavia]
    years: [2020, null]
    title_hints: ['octavia,?\s*(iv|4)\b(?![.,]\d)']
    vin_codes: [NX]
    engines: [ea211-1.0-tsi, ea211-1.5-tsi, ea888-2.0-tsi]

  golf-5:
    label: VW Golf V Variant
    models: [volkswagen:golf, volkswagen:golf-variant]
    years: [2007, 2009]
    title_hints: ['golf\s*(variant\s*)?(v|5)\b(?![.,]\d)']
    engines: [ea113-1.6-mpi, ea111-1.4-tsi]

  golf-6:
    label: VW Golf VI Variant
    models: [volkswagen:golf, volkswagen:golf-variant]
    years: [2009, 2013]
    title_hints: ['golf\s*(variant\s*)?(vi|6)\b(?![.,]\d)']
    engines: [ea113-1.6-mpi, ea111-1.2-tsi, ea111-1.4-tsi]

  golf-7:
    label: VW Golf VII Variant
    models: [volkswagen:golf, volkswagen:golf-variant]
    years: [2013, 2020]
    title_hints: ['golf\s*(variant\s*)?(vii|7)\b(?![.,]\d)']
    vin_codes: [AU]
    engines: [ea211-1.0-tsi, ea211-1.2-tsi, ea211-1.4-tsi, ea211-1.5-tsi, ea211-1.6-mpi]

  golf-8:
    label: VW Golf VIII Variant
    models: [volkswagen:golf, volkswagen:golf-variant]
    years: [2020, null]
    title_hints: ['golf\s*(variant\s*)?(viii|8)\b(?![.,]\d)']
    vin_codes: [CD]
    engines: [ea211-1.0-tsi, ea211-1.5-tsi]

  focus-2:
    label: Ford Focus II Kombi
    models: [ford:focus]
    years: [2004, 2011]
    title_hints: ['focus\s*(ii|2|mk\s*2)\b(?![.,]\d)']
    engines: [ford-1.6-tivct]

  focus-3:
    label: Ford Focus III Kombi
    models: [ford:focus]
    years: [2011, 2018]
    title_hints: ['focus\s*(iii|3|mk\s*3)\b(?![.,]\d)']
    engines: [ford-1.6-tivct, ford-1.0-ecoboost, ford-1.5-ecoboost, ford-1.6-ecoboost]

  focus-4:
    label: Ford Focus IV Kombi
    models: [ford:focus]
    years: [2018, null]
    title_hints: ['focus\s*(iv|4|mk\s*4)\b(?![.,]\d)']
    engines: [ford-1.0-ecoboost, ford-1.5-ecoboost]

  # Hyundai i30 and Kia cee'd share platforms and engines generation by generation.
  i30-1:
    label: Hyundai i30 CW (FD)
    models: [hyundai:i30]
    years: [2008, 2012]
    title_hints: ['\bi30\s*(cw\s*)?(i|1|fd)\b(?![.,]\d)']
    engines: [hyundai-kia-1.4-mpi, hyundai-kia-1.6-mpi, hyundai-kia-2.0-mpi]

  i30-2:
    label: Hyundai i30 Kombi (GD)
    models: [hyundai:i30]
    years: [2012, 2017]
    title_hints: ['\bi30\s*(kombi\s*|combi\s*|wagon\s*)?(ii|2|gd)\b(?![.,]\d)']
    engines: [hyundai-kia-1.4-mpi, hyundai-kia-1.6-mpi, hyundai-kia-1.6-gdi]

  i30-3:
    label: Hyundai i30 Kombi (PD)
    models: [hyundai:i30]
    years: [2017, null]
    title_hints: ['\bi30\s*(kombi\s*|combi\s*|wagon\s*)?(iii|3|pd)\b(?![.,]\d)']
    engines: [hyundai-kia-1.0-tgdi, hyundai-kia-1.4-mpi, hyundai-kia-1.4-tgdi,
              hyundai-kia-1.5-dpi, hyundai-kia-1.5-tgdi]

  ceed-1:
    label: Kia cee'd SW (ED)
    models: [kia:cee-d, kia:cee-d-sw]
    years: [2007, 2012]
    engines: [hyundai-kia-1.4-mpi, hyundai-kia-1.6-mpi, hyundai-kia-2.0-mpi]

  ceed-2:
    label: Kia cee'd SW (JD)
    models: [kia:cee-d, kia:cee-d-sw]
    years: [2012, 2018]
    title_hints: ['\bjd\b']
    engines: [hyundai-kia-1.0-tgdi, hyundai-kia-1.4-mpi, hyundai-kia-1.6-mpi,
              hyundai-kia-1.6-gdi]

  ceed-3:
    label: Kia Ceed SW (CD)
    models: [kia:cee-d, kia:cee-d-sw]
    years: [2018, null]
    engines: [hyundai-kia-1.0-tgdi, hyundai-kia-1.4-mpi, hyundai-kia-1.4-tgdi,
              hyundai-kia-1.5-dpi, hyundai-kia-1.5-tgdi, hyundai-kia-1.6-tgdi]

  # Liftback + estate; the Superb I (2001-2008) was a sedan, so it isn't listed.
  superb-2:
    label: Škoda Superb II (3T)
    models: [skoda:superb]
    years: [2008, 2015]
    title_hints: ['superb,?\s*(ii|2)\b(?![.,]\d)', '\b3t\b']
    vin_codes: [3T]
    engines: [ea111-1.4-tsi, ea888-1.8-tsi-early, ea888-2.0-tsi, vr6-3.6-fsi]

  superb-3:
    label: Škoda Superb III (3V)
    models: [skoda:superb]
    years: [2015, 2024]
    title_hints: ['superb,?\s*(iii|3)\b(?![.,]\d)', '\b3v\b']
    vin_codes: [3V]
    engines: [ea211-1.4-tsi, ea211-1.5-tsi, ea888-1.8-tsi, ea888-2.0-tsi]

  # Passat: estate (Variant) only; the saloon has no liftback.
  passat-b6:
    label: VW Passat B6 Variant
    models: [volkswagen:passat, volkswagen:passat-variant]
    years: [2005, 2011]
    title_hints: ['\bb6\b', '\b3c\b']
    engines: [ea113-1.6-mpi, vw-1.6-fsi, ea111-1.4-tsi, ea888-1.8-tsi-early, vw-2.0-fsi,
              ea888-2.0-tsi, vr6-3.2-fsi]

  passat-b7:
    label: VW Passat B7 Variant
    models: [volkswagen:passat, volkswagen:passat-variant]
    years: [2010, 2015]
    title_hints: ['\bb7\b']
    engines: [ea111-1.4-tsi, ea888-1.8-tsi-early, ea888-2.0-tsi]

  passat-b8:
    label: VW Passat B8 Variant
    models: [volkswagen:passat, volkswagen:passat-variant]
    years: [2014, 2023]
    title_hints: ['\bb8\b']
    vin_codes: [3G]
    engines: [ea211-1.4-tsi, ea211-1.5-tsi, ea888-1.8-tsi, ea888-2.0-tsi]

  # Mazda 6: estate, plus the GH's 5-door liftback (listed as hatchback or liftback).
  mazda6-gh:
    label: Mazda 6 (GH)
    models: [mazda:6]
    years: [2008, 2013]
    title_hints: ['\bgh\b']
    engines: [mazda-1.8-mzr, mazda-2.0-mzr, mazda-2.5-mzr]

  mazda6-gj:
    label: Mazda 6 (GJ/GL)
    models: [mazda:6]
    years: [2012, null]
    title_hints: ['\bgj\b', '\bgl\b', 'skyactiv']
    engines: [mazda-2.0-skyactiv-g, mazda-2.5-skyactiv-g]

  # Toyota: estate versions only (Touring Sports / Wagon).
  auris-2:
    label: Toyota Auris II Touring Sports
    models: [toyota:auris]
    years: [2013, 2019]
    title_hints: ['auris\s*(ii|2)\b(?![.,]\d)', 'touring\s*sports?']
    engines: [toyota-1.33-dvvti, toyota-1.6-valvematic, toyota-1.2-t, toyota-1.8-hybrid]

  avensis-t27:
    label: Toyota Avensis Wagon (T27)
    models: [toyota:avensis]
    years: [2009, 2018]
    title_hints: ['\bt27\b']
    engines: [toyota-1.6-valvematic, toyota-1.8-valvematic, toyota-2.0-valvematic]

  corolla-12:
    label: Toyota Corolla Touring Sports (E210)
    models: [toyota:corolla]
    years: [2019, null]
    title_hints: ['\be21\d?\b', 'touring\s*sports?']
    engines: [toyota-1.2-t, toyota-1.8-hybrid, toyota-2.0-hybrid]

  # Seat Leon ST: the Octavia III's platform and engines, estate only.
  leon-3:
    label: Seat Leon III ST (5F)
    models: [seat:leon]
    years: [2014, 2020]
    title_hints: ['leon\s*(st\s*)?(iii|3)\b(?![.,]\d)', '\b5f\b']
    vin_codes: [5F]
    engines: [ea211-1.0-tsi, ea211-1.2-tsi, ea211-1.4-tsi, ea211-1.5-tsi, ea211-1.6-mpi,
              ea888-1.8-tsi, ea888-2.0-tsi]

  leon-4:
    label: Seat Leon IV Sportstourer (KL)
    models: [seat:leon]
    years: [2020, null]
    title_hints: ['leon\s*(st\s*|sportstourer\s*)?(iv|4)\b(?![.,]\d)', '\bkl\b']
    engines: [ea211-1.0-tsi, ea211-1.5-tsi, ea888-2.0-tsi]

  # Rapid and Toledo IV are twins (liftback). The Rapid Spaceback is a hatchback and
  # shares the Sauto model, so it can only be told apart by its name.
  rapid-1:
    label: Škoda Rapid (NH)
    models: [skoda:rapid]
    years: [2012, 2019]
    vin_codes: [NH]
    engines: [ea111-1.2-htp, ea111-1.2-tsi, ea211-1.0-tsi, ea211-1.2-tsi, ea111-1.4-tsi,
              ea211-1.4-tsi, ea111-1.6-mpi, ea211-1.6-mpi]

  toledo-4:
    label: Seat Toledo IV (KG)
    models: [seat:toledo]
    years: [2012, 2019]
    engines: [ea111-1.2-htp, ea111-1.2-tsi, ea211-1.0-tsi, ea211-1.2-tsi, ea111-1.4-tsi,
              ea211-1.4-tsi, ea111-1.6-mpi, ea211-1.6-mpi]

  # Honda: estate versions only.
  civic-9-tourer:
    label: Honda Civic IX Tourer (FK)
    models: [honda:civic]
    years: [2014, 2018]
    title_hints: ['tourer']
    engines: [honda-1.8-ivtec]

  accord-8-tourer:
    label: Honda Accord VIII Tourer (CW)
    models: [honda:accord]
    years: [2008, 2015]
    title_hints: ['tourer']
    engines: [honda-2.0-ivtec, honda-2.4-ivtec]

  # Dacia Logan MCV (estate); the Logan III (2020+) has no estate.
  logan-1-mcv:
    label: Dacia Logan MCV I
    models: [dacia:logan]
    years: [2006, 2013]
    engines: [renault-1.4-mpi, renault-1.6-mpi-8v, renault-1.6-16v]

  logan-2-mcv:
    label: Dacia Logan MCV II
    models: [dacia:logan]
    years: [2013, 2020]
    engines: [renault-1.2-16v, renault-1.0-sce, renault-0.9-tce]

  # Hyundai i40: D-segment saloon and estate (CW/Wagon); petrol engines are naturally aspirated.
  i40-1:
    label: Hyundai i40 CW (VF)
    models: [hyundai:i40]
    years: [2011, 2019]
    engines: [hyundai-kia-1.6-gdi, hyundai-kia-2.0-mpi, hyundai-kia-2.0-gdi]

engines:
  # --- VW group -------------------------------------------------------------------
  ea211-1.6-mpi:
    label: 1.6 MPI (EA211)
    liters: 1.6
    power_kw: [81]
    turbo: false
    status: preferred
    notes: Naturally aspirated, timing belt, no turbo or direct injection.

  ea113-1.6-mpi:
    label: 1.6 MPI (EA113)
    liters: 1.6
    power_kw: [75]
    turbo: false
    status: preferred
    notes: Older naturally aspirated 8-valve engine with timing belt; simple and widely regarded as durable. Verify belt replacement.

  ea211-1.4-tsi:
    label: 1.4 TSI (EA211)
    liters: 1.4
    power_kw: [90, 92, 103, 110]
    turbo: true
    status: ok
    notes: Belt-driven successor to the EA111. Verify engine code and belt service.
    automatic_note: &dq200 Automatic is most likely the 7-speed dry-clutch DSG (DQ200), which has a mixed reliability record. Ask for gearbox service history.

  ea111-1.4-tsi:
    label: 1.4 TSI (EA111)
    liters: 1.4
    power_kw: [90, 118, 125]
    turbo: true
    status: avoid
    notes: Excluded. Timing-chain stretch/tensioner and piston problems are widely reported on EA111 1.4 TSI.
    automatic_note: *dq200

  ea211-1.2-tsi:
    label: 1.2 TSI (EA211)
    liters: 1.2
    power_kw: [63, 66, 77, 81]
    turbo: true
    status: ok
    notes: Belt-driven 4-cylinder.
    automatic_note: *dq200

  ea111-1.2-tsi:
    label: 1.2 TSI (EA111)
    liters: 1.2
    power_kw: [63, 77]
    turbo: true
    status: avoid
    notes: Excluded. Chain-driven; timing-chain stretch widely reported.
    automatic_note: *dq200

  ea211-1.0-tsi:
    label: 1.0 TSI (EA211)
    liters: 1.0
    power_kw: [63, 70, 81, 85]
    turbo: true
    status: unvetted
    automatic_note: *dq200

  ea211-1.5-tsi:
    label: 1.5 TSI (EA211 evo)
    liters: 1.5
    power_kw: [96, 110]
    turbo: true
    status: unvetted
    automatic_note: *dq200

  ea888-1.8-tsi:
    label: 1.8 TSI (EA888 gen 3)
    liters: 1.8
    power_kw: [132]
    turbo: true
    status: unvetted

  ea888-1.8-tsi-early:
    label: 1.8 TSI (EA888 early)
    liters: 1.8
    power_kw: [112, 118]
    turbo: true
    status: caution
    notes: Early EA888 versions have widely reported excessive oil consumption.

  ea888-2.0-tsi:
    label: 2.0 TSI (EA888)
    liters: 2.0
    power_kw: [140, 147, 155, 162, 169, 180, 182, 195, 200, 206]
    turbo: true
    status: unvetted
    notes: Performance-oriented (mostly RS); outside your priorities.

  # --- Ford -----------------------------------------------------------------------
  ford-1.6-tivct:
    label: 1.6 Ti-VCT
    liters: 1.6
    power_kw: [63, 77, 85, 92]
    turbo: false
    status: ok
    notes: Naturally aspirated Sigma engine with timing belt. Verify belt history.
    automatic_note: In the Focus III the automatic is usually the PowerShift dual-clutch, which has a poor reliability record. Focus II used a conventional automatic.

  ford-1.0-ecoboost:
    label: 1.0 EcoBoost
    liters: 1.0
    power_kw: [63, 74, 92]
    turbo: true
    status: caution
    notes: 3-cylinder turbo with oil-immersed timing belt; early versions had reported cooling-system/overheating problems. Check recalls and service history.

  ford-1.5-ecoboost:
    label: 1.5 EcoBoost
    liters: 1.5
    power_kw: [110, 132, 134]
    turbo: true
    status: unvetted

  ford-1.6-ecoboost:
    label: 1.6 EcoBoost
    liters: 1.6
    power_kw: [110, 134]
    turbo: true
    status: caution
    notes: Overheating-related problems and recalls reported. Check recall completion.

  # --- Hyundai / Kia --------------------------------------------------------------
  # 1.6 GDI and 1.6 MPI are both naturally aspirated and share 88 kW in some years,
  # so the title's "GDI" / "MPI" / "CVVT" decides between them when present.
  hyundai-kia-1.6-gdi:
    label: 1.6 GDI (Gamma)
    liters: 1.6
    power_kw: [88, 99]
    turbo: false
    status: ok
    title_hints: ['(?<![a-z-])gdi\b']
    notes: Naturally aspirated direct injection with timing chain. Direct injection can build carbon on the intake valves; ask about oil consumption and chain noise on a cold start.

  hyundai-kia-1.6-mpi:
    label: 1.6 MPI/CVVT (Gamma)
    liters: 1.6
    power_kw: [85, 88, 90, 93, 95]
    turbo: false
    status: unvetted
    title_hints: ['(?<![a-z])mpi\b', 'cvvt', '\b1[.,]6\s*i\b']

  hyundai-kia-1.4-mpi:
    label: 1.4 MPI/CVVT
    liters: 1.4
    power_kw: [66, 73, 74, 77, 80]
    turbo: false
    status: unvetted

  hyundai-kia-2.0-mpi:
    label: 2.0 CVVT
    liters: 2.0
    power_kw: [105, 110]
    turbo: false
    status: unvetted

  hyundai-kia-2.0-gdi:
    label: 2.0 GDI (Nu)
    liters: 2.0
    power_kw: [130]
    turbo: false
    status: unvetted
    title_hints: ['(?<![a-z-])gdi\b']

  hyundai-kia-1.5-dpi:
    label: 1.5 DPI (Smartstream)
    liters: 1.5
    power_kw: [81]
    turbo: false
    status: unvetted

  hyundai-kia-1.0-tgdi:
    label: 1.0 T-GDI (Kappa)
    liters: 1.0
    power_kw: [74, 88]
    turbo: true
    status: unvetted

  hyundai-kia-1.4-tgdi:
    label: 1.4 T-GDI (Kappa)
    liters: 1.4
    power_kw: [103]
    turbo: true
    status: unvetted

  hyundai-kia-1.5-tgdi:
    label: 1.5 T-GDI (Smartstream)
    liters: 1.5
    power_kw: [103, 117, 118]
    turbo: true
    status: unvetted

  hyundai-kia-1.6-tgdi:
    label: 1.6 T-GDI (Gamma)
    liters: 1.6
    power_kw: [150]
    turbo: true
    status: unvetted
    notes: Performance-oriented (GT); outside your priorities.

  # --- VW group, older / larger ----------------------------------------------------
  vw-1.6-fsi:
    label: 1.6 FSI
    liters: 1.6
    power_kw: [85]
    turbo: false
    status: unvetted
    title_hints: ['(?<![a-z])fsi\b']

  vw-2.0-fsi:
    label: 2.0 FSI
    liters: 2.0
    power_kw: [110]
    turbo: false
    status: unvetted
    title_hints: ['(?<![a-z])fsi\b']

  vr6-3.2-fsi:
    label: 3.2 V6 FSI
    liters: 3.2
    power_kw: [184]
    turbo: false
    status: unvetted
    notes: Large V6, mostly 4MOTION; outside your priorities.

  vr6-3.6-fsi:
    label: 3.6 V6 FSI
    liters: 3.6
    power_kw: [191, 220]
    turbo: false
    status: unvetted
    notes: Large V6, 4x4; outside your priorities.

  # --- Mazda ----------------------------------------------------------------------
  mazda-1.8-mzr:
    label: 1.8 MZR
    liters: 1.8
    power_kw: [88]
    turbo: false
    status: ok
    notes: Naturally aspirated with timing chain. On the Mazda 6 GH, check for rust (rear wheel arches, sills).

  mazda-2.0-mzr:
    label: 2.0 MZR / DISI
    liters: 2.0
    power_kw: [108, 114]
    turbo: false
    status: ok
    notes: Naturally aspirated with timing chain (114 kW is the direct-injection DISI). On the Mazda 6 GH, check for rust (rear wheel arches, sills).

  mazda-2.5-mzr:
    label: 2.5 MZR
    liters: 2.5
    power_kw: [125]
    turbo: false
    status: ok
    notes: Naturally aspirated with timing chain; thirsty. On the Mazda 6 GH, check for rust.

  mazda-2.0-skyactiv-g:
    label: 2.0 Skyactiv-G
    liters: 2.0
    power_kw: [107, 110, 121]
    turbo: false
    status: ok
    notes: Naturally aspirated direct injection with timing chain, no turbo.

  mazda-2.5-skyactiv-g:
    label: 2.5 Skyactiv-G
    liters: 2.5
    power_kw: [141, 143]
    turbo: false
    status: ok
    notes: Naturally aspirated with timing chain; thirstier than the 2.0.

  # --- Toyota ---------------------------------------------------------------------
  toyota-1.33-dvvti:
    label: 1.33 Dual VVT-i
    liters: 1.3
    power_kw: [73]
    turbo: false
    status: unvetted
    notes: Small for an estate.

  toyota-1.6-valvematic:
    label: 1.6 Valvematic
    liters: 1.6
    power_kw: [97, 98]
    turbo: false
    status: ok
    title_hints: ['valvematic']
    notes: Naturally aspirated with timing chain.

  toyota-1.8-valvematic:
    label: 1.8 Valvematic
